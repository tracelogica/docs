apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tracelogica-redirect-https
  namespace: apps
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tracelogica-www-to-apex
  namespace: apps
spec:
  redirectRegex:
    regex: ^https?://www\.tracelogica\.com/(.*)
    replacement: https://tracelogica.com/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracelogica-site
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [tracelogica.com]
      secretName: tracelogica-com-tls
  rules:
    - host: tracelogica.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracelogica-site
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracelogica-site-www
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: apps-tracelogica-www-to-apex@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [www.tracelogica.com]
      secretName: tracelogica-www-tls
  rules:
    - host: www.tracelogica.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracelogica-site
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracelogica-site-http
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: apps-tracelogica-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: tracelogica.com
      http: &site
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracelogica-site
                port:
                  number: 80
    - host: www.tracelogica.com
      http: *site
