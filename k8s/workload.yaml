apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracelogica-site
  namespace: apps
  labels:
    app.kubernetes.io/name: tracelogica-site
    app.kubernetes.io/part-of: tracelogica
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracelogica-site
  namespace: apps
  labels:
    app.kubernetes.io/name: tracelogica-site
    app.kubernetes.io/part-of: tracelogica
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tracelogica-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracelogica-site
        app.kubernetes.io/part-of: tracelogica
    spec:
      serviceAccountName: tracelogica-site
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-tracelogica-site
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tracelogica-site
          image: nginxinc/nginx-unprivileged:1.29.1-alpine3.22
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tracelogica-site
  namespace: apps
  labels:
    app.kubernetes.io/name: tracelogica-site
    app.kubernetes.io/part-of: tracelogica
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tracelogica-site
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tracelogica-site
  namespace: apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tracelogica-site
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracelogica-site
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tracelogica-site
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 8080
  egress: []
