name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tracelogica-site-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  APP_NAME: tracelogica-site
  NAMESPACE: apps
  IMAGE: ghcr.io/${{ github.repository_owner }}/docs-site

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test documentation site
        run: make test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64, k3s, deploy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy to k3s
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-tracelogica-site \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USER" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/
          kubectl -n "$NAMESPACE" set image "deployment/$APP_NAME" "$APP_NAME=$IMAGE_REF"
          kubectl -n "$NAMESPACE" rollout status "deployment/$APP_NAME" --timeout=180s
      - name: Verify public website
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://tracelogica.com/status.html | grep -q 'Pre-release'
